solid var(--line);border-radius:7px;padding:9px 15px;background:#23252c;color:var(--text);display:inline-flex;gap:8px;align-items:center;text-decoration:none}.btn:hover{border-color:#8d8f98}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.small{font-size:12px;padding:5px 10px}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:10px}.track{display:flex;flex-direction:column;min-height:230px}.track p{font-size:13px;color:var(--muted)}.track .btn{margin-top:auto;align-self:flex-start}.tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}.stats strong{font-size:27px;display:block}.stats small{color:var(--muted)}.progress{height:4px;background:#333;border-radius:5px;margin:15px 0}.progress i{display:block;height:100%;background:var(--red)}.worklayout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px}.rail{display:grid;align-content:start;gap:9px}.mission{border:1px solid var(--line);background:var(--panel);color:var(--muted);text-align:left;border-radius:8px;padding:13px}.mission.active{border-color:var(--red);color:white}.mission small{display:block;font-size:11px}.workhead{display:flex;justify-content:space-between;align-items:start;gap:20px}.brief{background:#211f20;border-left:3px solid var(--red);padding:18px;margin:20px 0}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tabs button{white-space:nowrap;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:12px}.tabs button.on{color:white;border-color:var(--red)}.columns{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.field{margin-bottom:14px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;background:#101216;border:1px solid #42444d;border-radius:6px;color:white;padding:10px}textarea{resize:vertical;min-height:160px}.code{font:13px/1.7 ui-monospace,monospace;min-height:310px;tab-size:2}.preview{width:100%;height:280px;border:1px solid var(--line);border-radius:7px;background:white}.notice{font-size:12px;padding:12px;background:#22252b;border-radius:6px;color:var(--muted);margin:12px 0}.check{display:flex;gap:9px;padding:9px 0;font-size:13px}.pass{color:var(--green)}.fail{color:#ffaaa4}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px}th{color:var(--muted);font-size:11px}td input{min-width:95px}.reviewitem{padding:15px;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:20px;right:20px;background:#fff;color:#222;padding:13px 20px;border-radius:8px;max-width:380px;z-index:30}.empty{padding:35px;text-align:center;color:var(--muted)}.step{display:grid;grid-template-columns:45px 1fr;gap:12px;margin-bottom:15px}.step b{color:var(--red);font:22px ui-monospace,monospace}.poster{padding:30px;border-radius:6px;min-height:260px;display:flex;flex-direction:column;justify-content:center}.poster .kicker{font-size:12px;letter-spacing:2px}.poster h2{font-size:38px;line-height:1.05;margin:18px 0}.poster a{align-self:start;padding:8px 15px;background:currentColor}.answer{display:block;margin:10px 0;padding:13px;border:1px solid var(--line);border-radius:6px;cursor:pointer}.answer input{width:auto;margin-right:10px}.caption{font-size:12px;color:var(--muted)}.separator{height:1px;background:var(--line);margin:25px 0}.review-list{margin:0;padding-left:20px}.review-list li{margin:10px 0}details{border:1px solid var(--line);border-radius:7px;padding:14px;margin:12px 0}summary{cursor:pointer}.mobilebrand{display:none}.skip{position:absolute;left:-9999px}.skip:focus{left:20px;top:10px;background:white;color:black;padding:10px;z-index:50}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.sidebar{width:190px}.shell{grid-template-columns:190px 1fr}.content,.top{padding:24px}.worklayout{grid-template-columns:190px 1fr}}@media(max-width:760px){.shell{display:block}.sidebar{height:auto;width:auto;position:static;padding:17px;border-right:0;border-bottom:1px solid var(--line)}.sidebar nav{display:flex;overflow:auto;margin-top:12px;gap:3px}.sidebar .bottom{display:none}.nav{white-space:nowrap;padding:8px 12px}.content{padding:20px}.top{padding:12px 20px}.hero{grid-template-columns:1fr;padding:23px}.hero .diagram{border:0;padding:0}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.worklayout{grid-template-columns:1fr}.rail{display:flex;overflow:auto}.mission{min-width:170px}.workhead{display:block}h1{letter-spacing:-1px}.btn{padding:8px 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
'use strict';
const KEY='digitalburj-professional-academy-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starter='<!doctype html>\n<html lang="en">\n<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Burj Café</title>\n<style>body { font-family: system-ui; padding: 24px; } button { padding: 12px 20px; }</style></head>\n<body>\n<!-- Replace this comment with the client page -->\n</body></html>';
function task(title,lab,brief,lesson,steps,criteria,quiz,options,answer,hints,extra={}){return {title,lab,brief,lesson,steps,criteria,quiz,options,answer,hints,...extra};}
const T=[];
function track(id,title,category,summary,role,tasks,capstone){T.push({id,title,category,summary,role,tasks:[...tasks,task('Client delivery / capstone','capstone',capstone,'Bring the separate skills together. A deliverable is ready when it meets the acceptance criteria and another professional can use it without asking you to explain every step. Automated checks cannot judge the complete quality of this work.',['Prepare the complete deliverable using the workbench and export it.','Run at least three relevant tests; include a failure case.','Record the limitations, support needs and handover instructions.'],['Deliverable attached in evidence export','Three test cases with expected and actual outcomes','A documented correction and retest','Scope, limitations and handover included'],'A client changes the brief after delivery. What should you do?',['Accept every change without recording it','Record the requested change, assess impact, agree scope and retest','Ignore the client'],1,['Compare the deliverable against the original acceptance criteria.','Include an explicit test table and a limitations section.','Send the evidence export to a qualified reviewer for independent assessment.']),task('Independent capability / defence','defence','Complete a fresh variant without step-by-step guidance. Explain one technical or operational decision, the alternative you rejected, and how you verified the result.','Being able to repeat an example is different from transferring the skill. Use an unfamiliar constraint and justify your decisions with observed evidence.',['Change the client, dataset or operating constraint.','Complete the variant without looking at the worked hints.','Answer reviewer questions and retain feedback for revision.'],['New scenario differs meaningfully from the guided task','Decision supported by evidence','Trade-off and failure case explained','Independent reviewer decision recorded outside this local app'],'What is the strongest evidence of independent capability?',['A copied template','A completed tutorial','A new deliverable that passes tests under changed constraints'],2,['Choose a constraint that forces a real decision.','Describe what failed and what the evidence changed.','A reviewer must evaluate the full evidence; this app does not issue expert credentials.'])]});}
track('foundation','Digital work & AI operations','Foundation','Work safely with files, structured briefs and AI-generated outputs.','AI-assisted operator',[
task('Turn a request into a delivery brief','brief','A café owner asks: “Make our ordering process better.” Clarify the objective, audience, constraints and acceptance before starting.','A brief converts a vague request into observable requirements. Acceptance criteria describe how the client decides the work is complete.',['Specify the business problem and the people affected.','Define a concrete output and two measurable acceptance checks.','List assumptions and questions that block implementation.'],['Audience named','Deliverable defined','Two acceptance checks','Constraints and open questions'],'Which criterion is testable?',['Make it amazing','Customers can submit an order with three required fields','Use advanced technology'],1,['Name a user and one action they need to complete.','Specify an observable result, such as a valid order appearing in a table.','Include a constraint, an owner and a definition of done.']),
task('Write an AI instruction with test cases','text','Ask an AI assistant to help validate café orders without exposing real customer information. Prepare the instruction and verification plan here.','Useful AI instructions contain context, inputs, required output, constraints and tests. A confident answer still needs verification.',['Provide two fictional sample orders.','Specify the expected output schema and missing-input behavior.','Write normal, missing-field and invalid-value tests.'],['Fictional examples','Output schema','Three test cases','Verification plan'],'An AI returns a convincing answer. What next?',['Trust the tone','Check it against inputs and acceptance tests','Publish it immediately'],1,['Separate the request from its acceptance tests.','Include an order with a missing item and an invalid quantity.','Require the assistant to state assumptions; verify results independently.']),
task('Inspect and reconcile a dataset','sheet','A weekly report contains three café orders. Calculate line totals, subtotal, 5% fictional tax and invoice total.','A spreadsheet formula expresses a relationship. Quantity multiplied by unit price gives a line total. Rounding should follow the stated policy.',['Calculate each line total.','Sum the line totals.','Calculate tax and grand total to two decimals.'],['All line totals correct','Subtotal correct','Tax correct','Grand total correct'],'Quantity is 3 and price is AED 12. What is the line total?',['15','36','4'],1,['Multiply quantity by unit price.','Subtotal is the sum of all three line totals.','Tax = subtotal × 0.05; total = subtotal + tax.']),
task('Prepare a professional handover','brief','Hand over the revised ordering workflow to a colleague. Include file names, version, owner, test evidence and next steps.','A handover explains how to use a result, who owns it, known limitations and what to do when it fails.',['List the deliverable and its version.','Record one successful test and one failure retest.','Set ownership, instructions and unresolved questions.'],['Deliverable and version','Named owner','Test evidence','Limitations and next steps'],'What makes a handover useful?',['A folder with unexplained files','A usable result with instructions, evidence and ownership','Only a screenshot'],1,['Use headings: Deliverable, Instructions, Tests, Limitations, Owner.','Write instructions a colleague can follow without your presence.','Add rollback or escalation instructions where appropriate.'])], 'Deliver a fictional café ordering improvement pack: approved brief, validated dataset, AI instruction, verification log and operational handover.');
track('web','Web development','Digital','Build and inspect an actual responsive page in an isolated browser preview.','Junior web builder',[
task('Build the client page structure','html','Burj Café needs a landing page with a main heading, a menu description, an Order tea button and a labeled email input.','HTML gives meaning to page content. A heading labels the main topic; a button represents an action; a label connects a field to its purpose.',['Replace the comment with h1, p and button elements.','Add an email input and connect it to a label using matching for/id attributes.','Run the preview and inspect the structure checks.'],['One h1','Descriptive paragraph','Meaningful button','Labeled email input'],'Which element represents an action?',['div','button','h1'],1,['Use <h1>Burj Café</h1> and <p>Fresh tea daily.</p>.','A button needs a meaningful text label, such as Order tea.','Use <label for="email">Email</label><input id="email" type="email">.']),
task('Repair the mobile layout','html','The page must remain usable on a 375px-wide phone. Add responsive spacing, a maximum content width and a visible keyboard focus state.','CSS styles elements. A responsive layout adapts to the available width; fixed wide content can cause horizontal overflow.',['Keep the viewport meta tag.','Add max-width and responsive width rules to the page container.','Add :focus-visible styling and test the 375px preview.'],['Viewport configured','Responsive width rule','Focus-visible rule','Manual mobile retest recorded'],'Why does a fixed 1200px container fail on a phone?',['It exceeds the viewport','It uses too little color','HTML cannot work on phones'],0,['Set width:100% and max-width:800px on a container.','Use box-sizing:border-box so padding fits the width.','Use :focus-visible { outline: 3px solid #b42318; }.'],{variant:'responsive'}),
task('Implement the ordering interaction','html','Make the Order tea button increment an order count. Display the result in an element with aria-live="polite".','JavaScript responds to events. An event listener runs a function when a click occurs. Text updates should remain understandable to assistive technology.',['Create a counter starting at zero.','Attach a click event listener to the order button.','Update the visible result and test repeated clicks.'],['Click handler present','Visible live result','Counter update present','Two-click manual test recorded'],'What does a click listener do?',['Changes only font size','Runs behavior when the button is clicked','Stores every user permanently'],1,['Give the button id="order" and the result id="count".','Use document.getElementById("order").addEventListener("click", ...).','Inside the handler, increment a number and update the result textContent.'],{variant:'interaction'}),
task('Add robust form validation','html','The café needs a contact form with required name and email fields. Prevent submission when fields are invalid and show a clear status.','Validation rejects incomplete or invalid inputs. Browser checks help users, but a real application also validates on the server.',['Add a form and required fields with labels.','Use type="email" for the email field.','Handle submission without navigating away and display a status.'],['Form present','Required name and email','Submit listener','Status region'],'Can browser validation replace server validation?',['Yes, always','No, the server must also validate','Only on weekdays'],1,['Use a form with <button type="submit">.','Add required to name and email fields; keep all labels associated.','Listen for submit and call preventDefault; write a success status after validity passes.'],{variant:'form'})], 'Deliver the complete café landing page with responsive layout, working order counter, accessible validated form, keyboard checks and a browser test log. Export the runnable HTML.');
track('app','Application & product delivery','Digital','Translate a business process into screens, data and acceptance tests.','Product implementation associate',[
task('Specify a booking application','brief','A repair service needs appointments with customer, date, service type and status. Define the minimum usable release.','A minimum usable release supports the complete essential workflow, including failure states. More screens do not automatically create more value.',['Define the user and booking journey.','Specify required fields and status transitions.','Write success and invalid-booking acceptance checks.'],['User journey','Required fields','Status transitions','Failure checks'],'What belongs in the first release?',['Every imagined feature','A complete essential booking workflow','Only a decorative home screen'],1,['Start with request → confirm → complete → cancel.','Define invalid dates and missing contact behavior.','Specify who may change status and how conflicts are handled.']),
task('Build the booking interface','html','Create a booking form with labeled name, email and date fields, a service selector and a submit button.','A form translates the data model into user inputs. Labels, required fields and useful errors reduce incomplete bookings.',['Build the form in the HTML lab.','Add all labels and required fields.','Inspect the live preview and test invalid input.'],['Form structure','Labeled fields','Required constraints','Submit behavior'],'What reduces incomplete bookings?',['Unlabeled inputs','Required fields with clear labels and errors','A longer animation'],1,['Use input types email and date.','Add <select> for service options.','Use a submit listener and a status element.'],{variant:'form'}),
task('Define data and authorization','text','Design the data contract for a booking app. A customer sees their own bookings; staff see assigned bookings; managers control assignment.','Authorization determines which records a person may access. Hiding a button is not a server access rule.',['Define booking fields and valid status values.','Describe access rules for each role.','Write tests for another customer’s booking, missing fields and duplicate submission.'],['Data contract','Role rules','Three negative tests','Duplicate handling'],'Where must record access be enforced?',['Only in CSS','On the server for each request','Only in a welcome email'],1,['Include id, customerId, assignedStaffId, date, service and status.','Check identity and record ownership at the server boundary.','Use a request identifier or duplicate detection policy and test it.']),
task('Triage a release defect','brief','Two customers can book the same technician at the same time. Prepare a reproducible defect report and acceptance plan.','A useful defect report includes steps, expected outcome, actual outcome, impact and evidence. Fixes need regression checks.',['Describe two simultaneous booking attempts.','Explain expected and actual results.','Specify a conflict check and regression tests.'],['Reproduction steps','Expected vs actual','Impact and priority','Regression checks'],'What demonstrates a fixed conflict?',['A new logo','Concurrent booking tests with one accepted and one rejected','Deleting the report'],1,['Use the same technician, date and time in two requests.','State that only one valid booking may occupy the slot.','Check that cancellation releases the slot correctly.'])], 'Deliver a repair-service booking implementation pack: interface, data contract, role permissions, concurrency test plan, release checklist and handover. Server implementation remains external to this browser workbench.');
track('design','Brand & interface design','Digital','Create a usable campaign composition and validate hierarchy, contrast and delivery.','Design production associate',[
task('Build a client campaign composition','design','A café is launching weekday breakfast. Create a composition with one clear headline, offer, call to action and two brand colors.','Visual hierarchy guides attention: the main message comes first, the supporting detail second, and the action last.',['Set a specific headline and supporting offer.','Set text and background colors.','Choose a concrete call to action and check contrast.'],['Clear headline','Offer context','Call to action','Text contrast at least 4.5:1'],'What should lead the composition?',['Five competing messages','One primary customer message','Only decorative shapes'],1,['Name the benefit and audience: Breakfast ready before work.','Use supporting text to state time, offer and terms.','Keep the action specific: Reserve breakfast.']),
task('Repair an inaccessible campaign','design','The client’s pale text is difficult to read. Revise the two-color campaign so ordinary text meets the contrast check.','Contrast compares the brightness of foreground and background. The checker uses 4.5:1 for ordinary text. It does not replace testing the complete layout.',['Choose the foreground and background.','Check the calculated contrast.','Verify the message and action remain clear.'],['Contrast 4.5:1','Legible message','Specific action','Consistent palette'],'What fixes low contrast?',['A different filename','A stronger foreground/background brightness difference','More text'],1,['Use a dark foreground with a light background or the reverse.','Adjust colors until the ratio reaches at least 4.5.','Check text sizes and crowding at mobile width.']),
task('Write an actionable design handoff','brief','Give a developer the campaign spec: colors, spacing, fonts, button states, mobile behavior and asset requirements.','A design handoff describes the intended behavior as well as appearance. A static mockup cannot explain validation or focus states.',['Specify exact colors and type hierarchy.','Describe spacing and mobile layout.','Define hover, focus, disabled and error states.'],['Color values','Typography and spacing','Responsive behavior','Interaction states'],'What must a button handoff include?',['Only its color','States and behavior as well as appearance','The designer’s favorite song'],1,['Use headings: Tokens, Layout, States, Assets.','Specify keyboard focus and disabled behavior.','Describe how long labels wrap on small screens.']),
task('Audit the client landing page','brief','Review the café landing page for hierarchy, mobile readability and conversion friction. Prioritize three actionable findings.','A design audit links each finding to a user problem and an improvement. Personal preference alone is weak evidence.',['Identify an observable usability issue.','Explain the affected action and severity.','Propose a change and a way to verify improvement.'],['Three findings','User impact','Prioritized fixes','Verification plan'],'Which audit finding is actionable?',['I dislike it','The unlabeled email field blocks understanding; add a visible label','It should be world-class'],1,['Check whether the next action is obvious.','Inspect field labels, contrast and keyboard focus.','Prioritize blocked tasks before decorative improvements.'])], 'Deliver a breakfast campaign, accessible two-color composition, responsive interface handoff and prioritized usability audit. Export the campaign as HTML.');
track('marketing','Digital marketing & content','Digital','Plan a measurable campaign, calculate performance and prepare production content.','Marketing operations associate',[
task('Prepare the campaign brief','brief','A café has a fictional AED 600 campaign budget to increase weekday breakfast orders. Define the audience, message, channel and measurable goal.','A marketing goal connects activity to a business result. Reach describes exposure; conversion describes a desired action.',['Define the customer segment and offer.','Choose a channel and allocate the budget.','Specify the conversion event and measurement plan.'],['Customer segment','Offer and channel','Budget allocation','Measurable conversion'],'Which is closest to a business outcome?',['Use ten hashtags','Track paid breakfast orders from the campaign','Post every hour'],1,['Choose a specific segment such as nearby office workers.','Describe a conversion and how it will be counted.','Separate production spending from media spending.']),
task('Calculate campaign performance','campaign','Campaign data: 10,000 impressions, 400 clicks, 20 orders and AED 600 spend. Calculate CTR, click-to-order conversion and cost per order.','CTR = clicks ÷ impressions × 100. Conversion rate here = orders ÷ clicks × 100. Cost per order = spend ÷ orders.',['Calculate click-through rate.','Calculate the defined conversion rate.','Calculate cost per order without confusing revenue and profit.'],['CTR correct','Conversion rate correct','Cost per order correct'],'Which denominator is used for click-to-order conversion?',['Impressions','Clicks','Budget'],1,['400 ÷ 10000 × 100.','20 ÷ 400 × 100.','600 ÷ 20.']),
task('Prepare a production content sequence','text','Create a three-post breakfast campaign: problem, offer and proof. Each post needs a purpose, opening line, asset brief, action and measurement.','Content production connects each asset to a customer decision. A hook should earn attention without promising unverified results.',['Define three distinct post purposes.','Write the copy and asset instructions.','Add an action and measurement for each.'],['Three distinct posts','Relevant opening lines','Asset instructions','Action and measurement'],'What makes a content sequence coherent?',['Repeating identical copy','Each asset supports a different step in the customer decision','Only changing colors'],1,['Post 1: morning time pressure; post 2: offer; post 3: verifiable evidence.','Specify what production must photograph or show.','Avoid invented testimonials and unsupported claims.']),
task('Prepare a short video production brief','text','Create a 30-second breakfast promotion for real footage. Specify shots, voiceover, on-screen text, timing and a final action.','A production script separates what viewers see from what they hear. Timing forces the message to stay focused.',['Map 0–5s problem, 5–18s preparation, 18–25s offer and 25–30s action.','Write narration and shot instructions separately.','Specify captions and evidence needed for claims.'],['Timed sequence','Shot instructions','Narration and captions','Specific action'],'Why specify shot and narration separately?',['To increase paperwork','So production can match visuals to the message','Because audio is never useful'],1,['Start with a real customer situation.','Show the product and process instead of unsupported superlatives.','Keep the final action visible long enough to read.'])], 'Deliver a complete breakfast campaign production pack: budget, audience, measurement plan, three posts, timed video script and performance interpretation.');
track('freelance','Freelancing & client delivery','Digital','Scope work, price a project and manage revisions with professional evidence.','Independent delivery practitioner',[
task('Qualify the client opportunity','brief','A small business asks for “a website like a big brand” within two weeks. Identify the goal, content availability, decision maker and scope risks.','Qualification determines whether the client problem, budget, timeline and your capability fit. Clarification prevents expensive assumptions.',['List the business goal and required pages.','Confirm budget, timeline and decision maker.','Record missing inputs and exclusions.'],['Business objective','Decision maker','Scope and constraints','Open questions'],'What should happen before pricing?',['Promise every feature','Clarify deliverables, constraints and approval process','Start without a brief'],1,['Ask what action the website should support.','List who supplies copy, images and access.','Define revisions, maintenance and excluded services.']),
task('Estimate and price the project','quote','Estimate 8 hours discovery, 18 hours build and 6 hours testing at AED 100/hour. Add a 15% contingency. Calculate base fee, contingency and quoted total.','An estimate makes effort and assumptions visible. Contingency covers identified uncertainty; it is not a guarantee every change is included.',['Sum the estimated hours.','Calculate the base fee.','Apply the stated contingency.'],['Base fee correct','Contingency correct','Total correct'],'How should extra features be handled?',['Absorbed silently forever','Through a recorded scope change and revised estimate','Never discussed'],1,['Total hours = 8 + 18 + 6.','Base = hours × 100.','Contingency = base × 0.15.']),
task('Prepare the proposal and acceptance plan','text','Write a proposal for the website including milestones, deliverables, assumptions, revision allowance and acceptance checks.','A useful proposal defines what is delivered and how completion is judged. Separate a milestone from a calendar promise that depends on missing content.',['Define discovery, build and test milestones.','Set revision scope and client responsibilities.','Write concrete acceptance and handover criteria.'],['Milestones','Revision boundaries','Client responsibilities','Acceptance checks'],'Which acceptance criterion is objective?',['Looks premium','Form validates required fields and layout works at 375px','Feels innovative'],1,['Include what the client must provide before work begins.','Limit revisions by scope and number.','Link payment milestones to deliverables rather than vague progress.']),

','pipeline','reconcile','budget','schedule'].includes(m.lab)){body=numericLab(m,d);}else{body=`<section class="card"><div class="eyebrow">Professional delivery editor</div><h3>${m.lab==='capstone'?'Client delivery package':m.lab==='defence'?'Independent variant and decision defence':'Prepare the usable work product'}</h3><p class="muted">${esc(m.steps.join(' '))}</p><label for="artifact" class="caption">Deliverable — use headings, records, decisions and actionable instructions</label><textarea id="artifact" style="min-height:330px" placeholder="Produce the work product here. Use the supplied brief and acceptance criteria. This is an editable delivery environment, not a prose quality evaluator.">${esc(d.artifact)}</textarea><div class="row">${button('Export work product','exportartifact')}${idx>=4?button('Export previous evidence','export','small'):''}</div><div class="notice">Open-ended work requires qualitative review. Keyword and evidence checks do not prove that a plan, message or analysis is professionally correct.</div></section>`;}return `${body}<div class="row between" style="margin-top:20px"><div>${button('Need guidance','hint','small')}<span class="caption"> ${d.hints||0} guidance steps used</span></div>${button('Run acceptance checks →','test','primary')}</div><div id="hintbox" class="notice" ${hint?'':'hidden'}>${hint?esc(m.hints[Math.min(hint-1,2)]):''}</div>`}
const numeric={sheet:{rows:[['Tea',3,12],['Breakfast',2,25],['Coffee',1,18]],fields:[['subtotal','Subtotal'],['tax','Tax (5% / fictional training rate)'],['total','Grand total']],expected:[104,5.2,109.2]},quote:{fields:[['base','Base fee'],['contingency','Contingency (15%)'],['total','Quoted total']],expected:[3200,480,3680]},campaign:{fields:[['ctr','CTR (%)'],['conversion','Click-to-order conversion (%)'],['cost','Cost per order (AED)']],expected:[4,5,30]},inventory:{fields:[['usable','Usable cartons'],['shortage','Shortage'],['damage','Damaged cartons']],expected:[114,4,2]},pipeline:{fields:[['lead1','Opportunity 1 weighted value'],['lead2','Opportunity 2 weighted value'],['lead3','Opportunity 3 weighted value'],['total','Total weighted pipeline']],expected:[2000,10000,12000,24000]},reconcile:{fields:[['book','Book closing balance'],['difference','Difference (bank − book)']],expected:[5500,-100]},budget:{fields:[['planned','Planned profit'],['actual','Actual profit'],['variance','Profit variance (actual − budget)']],expected:[8000,4500,-3500]}};
function numericLab(m,d){if(m.lab==='schedule')return `<section class="card"><h3>Resource scheduling desk</h3><p class="caption">One resource. Durations: 60 minutes each. Adjacent appointments allowed in this lab. Sales fixed at 09:00; Client fixed at 11:00.</p><div class="tablewrap"><table><thead><tr><th>Appointment</th><th>Start</th><th>End</th></tr></thead><tbody>${['Sales','Operations','Client'].map((n,i)=>`<tr><td>${n}</td><td><input aria-label="${n} start" data-field="start${i}" type="time" value="${esc(d.fields['start'+i]||['09:00','09:30','11:00'][i])}"></td><td><input aria-label="${n} end" data-field="end${i}" type="time" value="${esc(d.fields['end'+i]||['10:00','10:30','12:00'][i])}"></td></tr>`).join('')}</tbody></table></div><label class="caption" for="notes">Scheduling assumptions / buffers / handover</label><textarea id="notes">${esc(d.notes)}</textarea></section>`;const n=numeric[m.lab];return `<div class="columns"><section class="card"><h3>Working dataset</h3><p>${esc(m.brief)}</p>${n.rows?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Your line total</th></tr></thead><tbody>${n.rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><input aria-label="${r[0]} line total" type="number" step="any" data-field="line${i}" value="${esc(d.fields['line'+i]??'')}"></td></tr>`).join('')}</tbody></table></div>`:''}<div class="notice">You can enter a number or a simple arithmetic formula beginning with =, such as =3*12. Supported operators: + − * / and parentheses. Cell references are not supported.</div>${n.fields.map(([id,label])=>field(id,label,d.fields[id]??'')).join('')}</section><section class="card"><h3>Reconciliation & working notes</h3><label class="caption" for="notes">Record formulas, assumptions and interpretation</label><textarea id="notes" style="min-height:260px">${esc(d.notes)}</textarea><p class="caption">The acceptance checker compares your result against this assignment’s fixed dataset. For new datasets, recompute from the source values.</p>${button('Export working data','exportartifact')}</section></div>`}
function calc(v){const s=String(v??'').trim();if(!s)return NaN;if(!s.startsWith('='))return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN;const text=s.slice(1).replace(/\s/g,'');if(!/^[\d.+*/()\-]+$/.test(text))return NaN;const tokens=text.match(/\d*\.?\d+|[()+*/-]/g)||[];if(tokens.join('')!==text)return NaN;let at=0;function atom(){if(tokens[at]==='-'){at++;return -atom()}if(tokens[at]==='+'){at++;return atom()}if(tokens[at]==='('){at++;let v=sum();if(tokens[at++]!==')')throw Error();return v}const v=Number(tokens[at++]);if(!Number.isFinite(v))throw Error();return v}function product(){let v=atom();while(['*','/'].includes(tokens[at])){let op=tokens[at++],w=atom();v=op==='*'?v*w:v/w}return v}function sum(){let v=product();while(['+','-'].includes(tokens[at])){let op=tokens[at++],w=product();v=op==='+'?v+w:v-w}return v}try{let v=sum();return at===tokens.length&&Number.isFinite(v)?v:NaN}catch{return NaN}}
function contrast(f,b){function lum(c){let v=c.replace('#','').match(/../g).map(n=>parseInt(n,16)/255).map(n=>n<=.04045?n/12.92:((n+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2]}if(!/^#[\da-f]{6}$/i.test(f)||!/^#[\da-f]{6}$/i.test(b))return 0;const a=lum(f),z=lum(b);return (Math.max(a,z)+.05)/(Math.min(a,z)+.05)}
function validate(m,d){let a=[];const add=(name,pass,feedback)=>a.push({name,pass:!!pass,feedback});if(m.lab==='html'){const doc=new DOMParser().parseFromString(d.code,'text/html'),style=doc.querySelector('style')?.textContent||'',script=Array.from(doc.querySelectorAll('script')).map(s=>s.textContent).join(' ');const labeled=e=>!!e.id&&Array.from(doc.querySelectorAll('label')).some(l=>l.htmlFor===e.id&&l.textContent.trim());if(m.variant==='responsive'){add('Viewport meta',!!doc.querySelector('meta[name="viewport"]'),'Add a viewport meta tag.');add('Responsive CSS',/max-width\s*:/.test(style)&&/width\s*:\s*(100%|min\(|clamp\()/.test(style),'Set a maximum width and an adaptive width.');add('Visible keyboard focus',/:focus-visible/.test(style),'Add a :focus-visible rule.');add('Manual mobile evidence',d.notes.trim().length>=40,'Record a 375px test, its observed result and any correction.');}else if(m.variant==='interaction'){add('Click handler',/addEventListener\s*\(\s*['"]click['"]/.test(script)||!!doc.querySelector('[onclick]'),'Add a click event handler.');add('Live result region',!!doc.querySelector('[aria-live]'),'Add aria-live to the result element.');add('Counter implementation pattern',/\+\+|\+=\s*1|\+\s*1/.test(script),'Update the count on each click.');add('Manual repeated-click evidence',d.notes.trim().length>=40,'Record at least two clicks and the observed count.');}else if(m.variant==='form'){const inputs=Array.from(doc.querySelectorAll('input'));add('Form present',!!doc.querySelector('form'),'Use a form element.');add('Required labeled name',inputs.some(e=>e.type==='text'&&e.required&&labeled(e)),'Add a labeled required name input.');add('Required labeled email',inputs.some(e=>e.type==='email'&&e.required&&labeled(e)),'Add a labeled required email input.');add('Submit handler and status',/addEventListener\s*\(\s*['"]submit['"]/.test(script)&&/preventDefault/.test(script)&&!!doc.querySelector('[aria-live]'),'Handle submit with preventDefault and a live status.');}else{add('Main heading',doc.querySelectorAll('h1').length===1&&doc.querySelector('h1').textContent.trim().length>2,'Add one meaningful h1.');add('Menu description',Array.from(doc.querySelectorAll('p')).some(p=>p.textContent.trim().length>12),'Add a descriptive paragraph.');add('Action button',Array.from(doc.querySelectorAll('button')).some(b=>b.textContent.trim().length>3),'Add a button with a meaningful action label.');add('Labeled email input',Array.from(doc.querySelectorAll('input[type="email"]')).some(labeled),'Connect an email input to a visible label.');}}else if(m.lab.startsWith('ops-')){return opsValidate(m,d);}else if(m.lab==='design'){const ratio=contrast(d.fields.foreground||'#151515',d.fields.background||'#f7e6c5');add('Headline',String(d.fields.headline||'').trim().length>=8,'Write a meaningful primary message.');add('Offer/context',String(d.fields.offer||'').trim().length>=15,'Provide useful offer context.');add('Action label',String(d.fields.cta||'').trim().length>=4,'Specify the action.');add('Text contrast '+ratio.toFixed(2)+':1',ratio>=4.5,'Adjust foreground and background to reach at least 4.5:1.');}else if(m.lab==='schedule'){const time=s=>/^\d\d:\d\d$/.test(s||'')?Number(s.slice(0,2))*60+Number(s.slice(3)):NaN;const slots=[0,1,2].map(i=>[time(d.fields['start'+i]||['09:00','09:30','11:00'][i]),time(d.fields['end'+i]||['10:00','10:30','12:00'][i])]);add('Durations preserved',slots.every(([s,e])=>e-s===60),'Each appointment must last 60 minutes.');add('Fixed commitments',slots[0][0]===540&&slots[2][0]===660,'Keep Sales at 09:00 and Client at 11:00.');add('No overlap',slots.every(([s,e],i)=>Number.isFinite(s)&&Number.isFinite(e)&&slots.every(([s2,e2],j)=>i===j||e<=s2||e2<=s)),'Move Operations into a non-overlapping slot.');}else if(numeric[m.lab]){const n=numeric[m.lab];n.rows?.forEach((r,i)=>add(r[0]+' line total',Math.abs(calc(d.fields['line'+i])-r[1]*r[2])<.005,'Multiply quantity by unit price.'));n.fields.forEach(([id,label],i)=>add(label,Math.abs(calc(d.fields[id])-n.expected[i])<.005,'Recalculate from the stated dataset and formula.'));}else{const v=d.artifact.trim();add('Work product present',v.length>=350,'Prepare a substantive deliverable covering the brief.');add('Structured work product',v.split('\n').filter(l=>l.trim()).length>=6,'Separate records, decisions, checks and handover sections.');add('Evidence / verification included',/test|evidence|check|verify|verification|expected|actual|source/i.test(v),'Include evidence references or verification steps.');add('Ownership / action included',/owner|responsib|next|deadline|due|follow.up|action/i.test(v),'State ownership or the next action.');}return a}
function checks(m,d,r){const items=validate(m,d),q=d.quiz;return `<div class="columns"><section class="card"><h3>Acceptance check results</h3><p class="caption">${m.lab==='html'?'Structure and implementation-pattern checks. Manually test behavior in the preview; these checks do not execute or prove the learner code.':['brief','text','capstone','defence'].includes(m.lab)?'Evidence completeness checks only. A professional reviewer must judge content quality.':'Bounded checks against the stated assignment.'}</p>${items.map(x=>`<div class="reviewitem"><b class="${x.pass?'pass':'fail'}">${x.pass?'✓':'○'} ${esc(x.name)}</b>${x.pass?'':`<div class="caption">${esc(x.feedback)}</div>`}</div>`).join('')}<div class="row" style="margin-top:18px">${button('Revise deliverable','lab')}${button(idx>=4?'Queue for independent review':'Save checked assignment','submit','primary')}</div><div class="notice">${idx>=4?'Capstone and defence remain pending until an independent reviewer assesses your exported evidence. There is no live reviewer connection here.':'Passing local checks records practice completion. It does not certify professional mastery.'}</div></section><section class="card"><div class="eyebrow">Decision check</div><h3>${esc(m.quiz)}</h3>${m.options.map((o,i)=>`<label class="answer"><input type="radio" name="quiz" value="${i}" ${q===i?'checked':''}>${esc(o)}</label>`).join('')}<div id="quizfeedback" class="notice">${q===undefined?'Select a decision before completing the assignment.':q===m.answer?'Your decision matches the principle described in the preparation.':'Review the preparation and consider the impact of this choice.'}</div><label class="caption" for="reflection">Explain your decision / test interpretation</label><textarea id="reflection" placeholder="Explain your result, one assumption, and what you checked.">${esc(d.reflection)}</textarea></section></div>`}

function plan(){const t=current();return `<div class="eyebrow">Zero knowledge → independent professional delivery</div><h1>Your learning plan.</h1><div class="columns"><section class="card"><h3>Set a realistic practice schedule</h3>${field('learnername','Preferred name',S.name)}<div class="field"><label for="goal">Specialization</label><select id="goal">${T.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>${field('hours','Practice hours per week',S.hours,'number')}${button('Save learning plan','saveplan','primary')}<div class="notice">Planning estimate: 2 focused hours per guided assignment and 6 hours for the capstone and defence combined. Your first practice sequence takes roughly ${Math.ceil(14/Math.max(1,S.hours))} weeks at ${S.hours} hours/week. Advanced proficiency requires repeated delivery and qualified feedback; no fixed expert timeline is promised.</div><h3>Weekly rhythm</h3><p class="muted">Spend 20% of practice time on preparation, 60% producing the deliverable and 20% testing, reflecting and resolving feedback. Schedule two or three focused sessions, with a weekly evidence review.</p></section><section class="card"><h3>Progression to advanced capability</h3>${[['Foundation','Complete digital work basics; produce checked briefs, calculations and handovers.'],['Guided application','Complete the four assignments in one specialization, with hints and test evidence.'],['Independent delivery','Complete a new client capstone and unfamiliar variant; obtain qualitative review.'],['Collaborative operations','Deliver three projects with real dependencies, version control or custody records and peer review.'],['Supervised workplace transfer','Apply the skill on authorized real work with an experienced supervisor; record observed performance.'],['Advanced practice','Resolve ambiguous failures, justify trade-offs, maintain quality over repeated delivery and teach another practitioner.']].map(([name,text],i)=>`<div class="step"><b>0${i+1}</b><div><strong>${name}</strong><p class="caption">${text}</p></div></div>`).join('')}</section></div><div class="separator"></div><h2>${esc(t.title)} / advanced assignment backlog</h2><div class="grid">${advanced(t).map((x,i)=>`<div class="card"><span class="tag">Advanced brief 0${i+1}</span><h3 style="margin-top:15px">${esc(x[0])}</h3><p class="muted">${esc(x[1])}</p><p class="caption">Review gate: delivery quality, correctness, failure evidence, independent reasoning and maintainable handover.</p></div>`).join('')}</div>`}
function advanced(t){const map={foundation:[['Verify a multi-source operating report','Reconcile conflicting source records, maintain provenance and separate confirmed facts from assumptions.'],['Audit an AI-assisted workflow','Compare model output against acceptance data, identify a material error and implement a verification control.'],['Operate a repeatable handover process','Version the deliverable, assign ownership and demonstrate that another operator can follow it.']],web:[['Deliver a connected application','Build server validation, persistent storage and record-level access; verify denied requests and duplicate actions.'],['Improve a measured bottleneck','Measure loading and interaction behavior, identify a cause, implement a fix and compare the same test before and after.'],['Release and maintain the project','Prepare environment configuration, rollback, monitoring and a reproducible deployment handover.']],app:[['Build the server workflow','Implement persistent bookings and server permissions with role-specific test accounts.'],['Test concurrency and recovery','Simulate conflicting requests, retries and partial failure; verify consistency.'],['Run an acceptance release','Have a client complete the essential journey and resolve observed failures before release.']],design:[['Create a multi-screen design system','Specify tokens, reusable components, state behavior and accessibility tests across a complete flow.'],['Run a usability study','Observe authorized participants completing the core task and prioritize measured friction.'],['Deliver a developer-ready implementation','Review actual responsive output against the design and resolve discrepancies.']],marketing:[['Run a measured authorized campaign','Set event definitions and baseline, publish approved assets, and report costs and business outcomes.'],['Design a controlled comparison','Compare two creative approaches while recording audience, spend and confounding factors.'],['Build a campaign operating system','Define ownership, production quality, approval, reporting and iteration cadence.']],freelance:[['Manage a multi-stage client engagement','Agree scope, gather dependencies, deliver milestones and maintain a change log.'],['Recover a delayed project','Diagnose delays, replan dependencies and negotiate a documented recovery.'],['Build a sustainable delivery practice','Track actual effort, margin, quality defects and support demand across three projects.']],admin:[['Operate a controlled approval workflow','Track ownership, versions, approvals and escalation over a real authorized document cycle.'],['Coordinate a multi-resource schedule','Include room, person and travel constraints with recovery options.'],['Improve an office process','Measure lead time, identify an avoidable delay and test a documented change.']],logistics:[['Supervised dispatch operation','Observe actual custody checks, count verification and authorized dispatch under an experienced supervisor.'],['Multi-shipment exception planning','Prioritize three delays using service impact, capacity and verified recovery times.'],['Investigate recurring discrepancies','Compare counts and custody evidence across deliveries, then test a preventive control.']],sales:[['Manage a verified sales pipeline','Maintain sources, stage definitions, next actions and qualified probabilities across opportunities.'],['Run a client discovery and proposal','Complete an authorized discovery, create scoped options and record decision feedback.'],['Analyze conversion by stage','Calculate losses and cycle times, distinguish data gaps and propose a measurable improvement.']],finance:[['Complete an authorized reconciliation','Reconcile source records with approval separation and a full discrepancy trail under supervision.'],['Build a controlled reporting workbook','Separate inputs, formulas and outputs; test missing data and protect review integrity.'],['Explain operating variance','Analyze revenue and cost drivers without inventing causal explanations; propose evidence-backed actions.']],property:[['Supervised property coordination','Complete authorized viewings and factual records with local professional oversight.'],['Resolve a handover discrepancy','Compare approved records, inspection evidence and responsibility assignments before escalation.'],['Maintain a verified listing process','Track information source, date, approval and availability changes without unsupported claims.']],service:[['Handle an authorized incident','Maintain a factual timeline, safe evidence requests, ownership and customer updates.'],['Validate a corrective control','Reproduce the failure, test the control and verify that normal service still works.'],['Improve recurring support demand','Group verified cases, identify a supported driver and measure a preventive change.']]};return map[t.id]||map.foundation}
function review(){return `<div class="eyebrow">Assessment quality & workplace transfer</div><h1>Review the actual work.</h1><p class="muted">The academy’s objective is reliable delivery. An independent reviewer must inspect the work product and observed results, not just check whether text was entered.</p><div class="columns"><section class="card"><h3>Professional review rubric</h3><div class="tablewrap"><table><thead><tr><th>Criterion</th><th>Weight</th><th>Required evidence</th></tr></thead><tbody>${[['Correctness',30,'The result matches the supplied brief and verified source data.'],['Usability & handover',20,'Another person can use the deliverable with clear instructions.'],['Verification',20,'Normal and failure cases have expected/actual results and correction evidence.'],['Reasoning',15,'Decisions, alternatives and trade-offs are justified.'],['Professional process',15,'Ownership, scope, limitations and evidence provenance are clear.']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}%</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><p class="caption" style="margin-top:15px">Suggested independent review threshold: 80/100, no unresolved critical failure, and demonstrated transfer to a new scenario. This threshold is a proposed academy policy, not an accreditation standard.</p></section><section class="card"><h3>Review workflow</h3><ol class="review-list"><li>Learner exports the work product and test evidence.</li><li>A qualified reviewer reproduces the essential result.</li><li>Reviewer states specific findings, corrections and an assessment.</li><li>Learner fixes defects and supplies retest evidence.</li><li>Reviewer evaluates an independent variant before marking capability.</li></ol><div class="notice">This local workspace does not connect to reviewer accounts or securely store reviewer decisions. It deliberately keeps capstones pending. Team roles, signed assessments and live review queues require a backend.</div><h3>Selected plugin deliverables</h3><p><a href="https://skillsail.com/create/digitalburj-academy-zero-to-first-website-acw13sopbxk4i" target="_blank" rel="noopener">Open the private Skillsail website foundation module ↗</a></p><p class="caption">Explainer video generation was requested for browser / frontend / backend / database. The completed video is available on My workspace with a text equivalent.</p></section></div>`}
function bind(){document.querySelectorAll('[data-route]').forEach(e=>e.onclick=()=>{route=e.dataset.route;tab='brief';render()});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action,e));document.querySelectorAll('[data-mission]').forEach(e=>e.onclick=()=>{idx=Number(e.dataset.mission);tab='brief';hint=0;render()});document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;hint=0;render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{invalidate();draft().fields[e.dataset.field]=e.value;if(current().tasks[idx].lab.startsWith('ops-')){draft().events=[];document.querySelectorAll('[data-step]').forEach(b=>b.disabled=Number(b.dataset.step)!==0)}persist()});for(const id of ['code','notes','artifact','reflection']){const e=document.getElementById(id);if(e)e.oninput=()=>{invalidate();draft()[id]=e.value;persist()}}document.querySelectorAll('[name="quiz"]').forEach(e=>e.onchange=()=>{invalidate();draft().quiz=Number(e.value);persist();document.getElementById('quizfeedback').textContent=Number(e.value)===current().tasks[idx].answer?'Your decision matches the preparation principle.':'Review the preparation and reconsider the impact.'});const f=document.getElementById('filter');if(f)f.onchange=()=>{document.getElementById('tracks').innerHTML=T.filter(t=>f.value==='All'||t.category===f.value).map(trackCard).join('');document.querySelectorAll('#tracks [data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action,e))};const w=document.getElementById('width');if(w)w.onchange=()=>{const p=document.getElementById('preview');p.style.width=w.value;p.style.maxWidth='100%'};const imp=document.getElementById('importfile');if(imp)imp.onchange=()=>loadBackup(imp.files[0]);if(tab==='lab'&&route==='work'&&['html','design'].includes(current().tasks[idx].lab))preview();}
function action(a,e){const d=draft(),m=current().tasks[idx];if(a==='operate'){const o=opsSpec(m),step=Number(e.dataset.step),checks=opsValidate(m,d).slice(0,-1);if(!checks.every(x=>x.pass)){toast('The operating decisions contain an error. Review the case before taking this action.');return}if((d.events||[]).length!==step)return;invalidate();d.events=d.events||[];d.events.push({action:o.actions[step][1],date:new Date().toISOString(),fields:{...d.fields}});persist();render();toast('Operating case action recorded.');}else if(a==='catalog'){route='catalog';render()}else if(a==='track'){selected=e.dataset.track;idx=0;S.goal=selected;persist();route='work';tab='brief';render()}else if(a==='resume'){idx=current().tasks.findIndex((m,i)=>!record(current(),i));if(idx<0)idx=0;route='work';tab='brief';render()}else if(a==='lab'){tab='lab';render()}else if(a==='test'){tab='test';render()}else if(a==='preview')preview();else if(a==='hint'){hint=Math.min(hint+1,3);d.hints=Math.max(d.hints||0,hint);persist();document.getElementById('hintbox').hidden=false;document.getElementById('hintbox').textContent=m.hints[hint-1];}else if(a==='submit'){let checks=validate(m,d);if(!checks.every(c=>c.pass)){toast('Resolve the failed acceptance checks before saving.');return}if(d.quiz!==m.answer){toast('Review and complete the decision check.');return}if(d.reflection.trim().length<50){toast('Add a decision rationale and test interpretation of at least 50 characters.');return}S.records[key()]={status:idx>=4?'review_pending':'checked',date:new Date().toISOString(),checks,quiz:d.quiz,hints:d.hints||0};persist();toast(idx>=4?'Evidence prepared. Independent review remains pending.':'Guided practice checks saved.');render()}else if(a==='export')exportAll();else if(a==='exportcode')download(current().id+'-'+(idx+1)+'.html',d.code,'text/html');else if(a==='exportdesign')download('campaign-composition.html',designHTML(d),'text/html');else if(a==='exportartifact')exportArtifact();else if(a==='resetcode'){if(confirm('Replace the current HTML draft with the starter? Export first if you need the current version.')){invalidate();d.code=starter;persist();render()}}else if(a==='saveplan'){S.name=document.getElementById('learnername').value;S.hours=Math.max(1,Math.min(40,Number(document.getElementById('hours').value)||5));S.goal=selected=document.getElementById('goal').value;idx=0;persist();toast('Learning plan saved.');render()}else if(a==='open'){const [t,i]=e.dataset.key.split(':');selected=t;idx=Number(i);route='work';tab='evidence';render()}else if(a==='import')document.getElementById('importfile').click();}
function preview(){const m=current().tasks[idx],d=draft();if(m.lab==='html'){const p=document.getElementById('preview');if(p){const doc=new DOMParser().parseFromString(d.code,'text/html');const policy=doc.createElement('meta');policy.httpEquiv='Content-Security-Policy';policy.content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none';";doc.head.prepend(policy);p.srcdoc='<!doctype html>'+doc.documentElement.outerHTML}}else if(m.lab==='design'){const f=d.fields;let p=document.getElementById('poster');if(!p)return;p.style.color=/^#[\da-f]{6}$/i.test(f.foreground||'')?f.foreground:'#151515';p.style.background=/^#[\da-f]{6}$/i.test(f.background||'')?f.background:'#f7e6c5';p.innerHTML=`<div class="kicker">BURJ CAFÉ / WEEKDAY BREAKFAST</div><h2>${esc(f.headline||'Your campaign headline')}</h2><p>${esc(f.offer||'Offer and context appear here.')}</p><div style="border:1px solid currentColor;align-self:start;padding:8px 16px">${esc(f.cta||'Your action')}</div>`;document.getElementById('contrast').textContent='Text contrast: '+contrast(f.foreground||'#151515',f.background||'#f7e6c5').toFixed(2)+':1 · ordinary text target 4.5:1';}}
function designHTML(d){const f=d.fields,fg=/^#[\da-f]{6}$/i.test(f.foreground||'')?f.foreground:'#151515',bg=/^#[\da-f]{6}$/i.test(f.background||'')?f.background:'#f7e6c5';return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign composition</title><body style="margin:0;font-family:system-ui;padding:40px;color:'+fg+';background:'+bg+'"><main style="max-width:800px;margin:auto"><p>BURJ CAFÉ / WEEKDAY BREAKFAST</p><h1 style="font-size:clamp(36px,7vw,70px)">'+esc(f.headline)+'</h1><p>'+esc(f.offer)+'</p><p style="display:inline-block;border:1px solid;padding:12px 20px">'+esc(f.cta)+'</p></main></body></html>'}
function download(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportAll(){download('DigitalBurj-Academy-Evidence.json',JSON.stringify({format:'DigitalBurjAcademyEvidence',version:1,exportedAt:new Date().toISOString(),state:S},null,2),'application/json');toast('Evidence backup exported. It includes your drafts and notes.');}
function exportArtifact(){const d=draft(),m=current().tasks[idx];if(m.lab==='html'){download(current().id+'-deliverable.html',d.code,'text/html');return}if(m.lab==='design'){download('campaign-composition.html',designHTML(d),'text/html');return}download(current().id+'-'+(idx+1)+'-work-product.md','# '+m.title+'\n\n## Client brief\n'+m.brief+'\n\n## Deliverable\n'+(d.artifact||JSON.stringify(d.fields,null,2))+'\n\n## Operating action history\n'+JSON.stringify(d.events||[],null,2)+'\n\n## Test evidence\n'+d.notes+'\n\n## Decision rationale and limitations\n'+d.reflection+'\n\n## Local checks\n'+validate(m,d).map(c=>'- '+(c.pass?'PASS':'REVISE')+': '+c.name).join('\n'));}
async function loadBackup(file){if(!file)return;try{if(file.size>5000000)throw Error('Backup exceeds 5 MB.');const b=JSON.parse(await file.text()),s=b.state;if(b.format!=='DigitalBurjAcademyEvidence'||b.version!==1||s?.v!==1||!s.drafts||!s.records||typeof s.drafts!=='object'||typeof s.records!=='object'||Array.isArray(s.drafts)||Array.isArray(s.records))throw Error('Invalid academy backup.');const safe={v:1,name:String(s.name||''),goal:T.some(t=>t.id===s.goal)?s.goal:'web',hours:Math.max(1,Math.min(40,Number(s.hours)||5)),drafts:{},records:{},journal:[]};for(const [k,v] of Object.entries(s.drafts)){const [id,i]=k.split(':');if(!T.some(t=>t.id===id)||!/^\d$/.test(i)||Number(i)>5||!v||typeof v!=='object')continue;const fields={};for(const [f,val] of Object.entries(v.fields||{})){if(/^[a-zA-Z0-9]+$/.test(f))fields[f]=String(val)}safe.drafts[k]={code:String(v.code||starter),fields,notes:String(v.notes||''),artifact:String(v.artifact||''),reflection:String(v.reflection||''),hints:Math.max(0,Math.min(3,Number(v.hints)||0)),events:Array.isArray(v.events)?v.events.filter(e=>e&&typeof e.action==='string'&&typeof e.date==='string').slice(0,3):[],...(Number.isInteger(v.quiz)?{quiz:v.quiz}:{})};}for(const [k,v] of Object.entries(s.records)){if(safe.drafts[k]&&v&&['checked','review_pending'].includes(v.status)){const [id,i]=k.split(':'),m=T.find(t=>t.id===id).tasks[Number(i)],d=safe.drafts[k],checks=validate(m,d);if(checks.every(c=>c.pass)&&d.quiz===m.answer&&d.reflection.length>=50)safe.records[k]={status:Number(i)>=4?'review_pending':'checked',date:new Date(v.date).toString()==='Invalid Date'?new Date().toISOString():v.date,checks};}}if(!confirm('Replace this browser’s current progress with the validated backup? Export your current evidence first if needed.'))return;S=safe;selected=S.goal;idx=0;persist();render();toast('Backup imported. Checks were revalidated; reviewer approvals are not imported.');}catch(e){toast(e.message||'Could not import the backup.')}}
document.getElementById('exporttop').onclick=exportAll;
render();
</script></body></html>
