name = "digitalburj-academy"
main = ".cloudflare/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = ".cloudflare/assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

